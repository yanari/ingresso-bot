name: monitor-ingresso

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Só uma rodada por vez; a próxima fica na fila e começa quando a atual termina.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar anúncios já avisados
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Garantir arquivo de estado
        run: test -s seen.json || echo '{}' > seen.json

      - name: Rodar bot por 25 min
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -u bot.py --duration=1500

      - name: Salvar anúncios já avisados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
